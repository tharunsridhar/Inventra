name: CI

on:
  push:
    branches: [django]
  pull_request:
    branches: [django]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventra
          POSTGRES_PASSWORD: inventra
          POSTGRES_DB: inventra_django
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventra -d inventra_django"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-test-secret-not-for-production
      # pytest-django derives its own "test_inventra_django" DB from this at
      # test time (create + migrate + drop, once per test session) - this
      # value is also used directly by the standalone migration-chain check
      # below.
      DATABASE_URL: postgresql://inventra:inventra@localhost:5432/inventra_django
      # Only used by the "Run Django migrations" step below and by manage.py
      # commands generally - pytest itself uses config.settings.test, which
      # points cache/Celery at in-process backends (see config/settings/
      # test.py) and never touches this Redis service at all.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django migrations
        run: uv run python manage.py migrate

      - name: Lint with ruff
        run: uv run ruff check apps config tests manage.py

      - name: Run pytest
        run: uv run pytest -v
