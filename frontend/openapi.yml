        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this category.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      description: |-
        Every authenticated role can read; only Manager/Admin can write -
        the same split Inventra's `manager_or_admin` dependency enforces per
        write route, expressed once here via get_permissions() instead of
        once per endpoint.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
