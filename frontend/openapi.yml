  /inventory-transactions/:
    get:
      operationId: inventory_transactions_list
      description: |-
        Read-only on purpose - no create/update/delete routes exist here at
        all, so the ledger can't be edited or erased once written. That's
        enforced by which router this ViewSet is registered under (list/retrieve
        only), the same way Inventra's transactions.py only ever defines a GET.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_id
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: transaction_type
        schema:
          type: string
      tags:
      - inventory-transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryTransactionReadList'
          description: ''
  /inventory-transactions/{id}/:
    get:
