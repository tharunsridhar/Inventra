              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: |-
        Every authenticated role can read; only Manager/Admin can write -
        the same split Inventra's `manager_or_admin` dependency enforces per
        write route, expressed once here via get_permissions() instead of
        once per endpoint.
      parameters:
      - in: path
        name: id
