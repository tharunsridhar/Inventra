server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Django API has no /api prefix of its own, so the trailing slash on
    # proxy_pass makes nginx strip "/api" before forwarding. Same origin for the
    # browser, so no CORS configuration is involved.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Invoice PDFs
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Content-Disposition "inline";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page app: unknown paths fall back to index.html so client-side routes survive a reload.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
